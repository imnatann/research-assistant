model: .runtime/coding-mlx/model
data: .runtime/coding-mlx/data
train: true
fine_tune_type: lora
adapter_path: runs/coding-mlx-lora/adapter
seed: 917
num_layers: 12
batch_size: 1
iters: 256
val_batches: 16
